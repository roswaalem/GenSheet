<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Gensheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/leaflet/leaflet.css" />
  <link rel="stylesheet" href="assets/leaflet/MarkerCluster.css" />
  <link rel="stylesheet" href="assets/leaflet/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="assets/leaflet/leaflet.js" defer></script>
  <script src="assets/leaflet/markercluster.js" defer></script>
  <script type="module" src="main.js" defer></script>
</head>
<body>
  <!-- Quatre couches de fond fixes, sous toute l'interface. -->
  <div class="bg bg-base"></div>
  <div class="bg bg-nebula"></div>
  <div class="bg bg-stars"></div>
  <div class="bg bg-vignette"></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <!-- Notre logo mouton, recopié de assets/gensheet_logo.svg : en <img> on
             ne pourrait pas recolorer les tracés via currentColor. -->
        <span class="brand-mark">
          <svg viewBox="0 -6.8 240 240" role="img" aria-label="Gensheet">
            <path transform="matrix(1.625 0 0 1.625 81.03 3.84)" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="0.24" stroke-linecap="square" stroke-linejoin="bevel" d="M24 0C24.1906 16.3318 16.0492 24.1879 0 24C15.4917 24.1994 24.0246 31.6445 24 48C24.0642 32.3732 31.4998 23.8307 48 24C31.9897 24.2276 23.9897 16.2276 24 0Z"/>
            <path transform="matrix(1.625 0 0 1.625 3.02636283488897 42.84)" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="0.24" stroke-linecap="square" stroke-linejoin="bevel" d="M36.0022 0C20.8906 4.64904 0.233855 12.031 0.00223826 24C-0.233861 28.3063 18.2877 29.9016 18.0022 30C18.2695 29.8314 0.296269 23.928 12.0622 18C12.2139 18.0573 24.3339 12.209 42.0022 12C37.3049 9.10003 35.3049 5.10003 36.0022 0Z"/>
            <path transform="matrix(-1.625 0 0 1.625 237.033637165111 42.84)" fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="0.24" stroke-linecap="square" stroke-linejoin="bevel" d="M36.0022 0C20.8906 4.64904 0.233855 12.031 0.00223826 24C-0.233861 28.3063 18.2877 29.9016 18.0022 30C18.2695 29.8314 0.296269 23.928 12.0622 18C12.2139 18.0573 24.3339 12.209 42.0022 12C37.3049 9.10003 35.3049 5.10003 36.0022 0Z"/>
            <path transform="matrix(1.896 0 0 1.896 51.7589907692308 99.6087913645302)" fill="#003052" fill-rule="evenodd" stroke="#003052" stroke-width="0.24" stroke-linecap="square" stroke-linejoin="bevel" d="M36 60.05C30.1663 54.1892 18.5205 47.9128 0 48.05L0 0.0500078C11.9286 -0.0196873 24.5841 -0.161561 36 12.05C48.4758 0.479307 60.0916 -0.252861 72 0.0500078L72 48.05C55.2722 48.1125 43.2722 52.1125 36 60.05Z"/>
            <path transform="matrix(1.896 0 0 1.896 51.7589907692308 108.70959136453)" fill="#003052" fill-rule="evenodd" stroke="#003052" stroke-width="0.24" stroke-linecap="square" stroke-linejoin="bevel" d="M36 60.05C30.1663 54.1892 18.5205 47.9128 0 48.05L0 0.0500078C11.9286 -0.0196873 24.5841 -0.161561 36 12.05C48.4758 0.479307 60.0916 -0.252861 72 0.0500078L72 48.05C55.2722 48.1125 43.2722 52.1125 36 60.05Z"/>
            <path transform="matrix(1.80196304139878 0 0 1.9232738078876 55.1443202506351 104.164373269033)" fill="#fec28e" fill-rule="evenodd" stroke="#fec28e" stroke-width="0.24" stroke-linecap="square" stroke-linejoin="bevel" d="M36 60.05C30.1663 54.1892 18.5205 47.9128 0 48.05L0 0.0500078C11.9286 -0.0196873 24.5841 -0.161561 36 12.05C48.4758 0.479307 60.0916 -0.252861 72 0.0500078L72 48.05C55.2722 48.1125 43.2722 52.1125 36 60.05Z"/>
            <path transform="matrix(1.65899998612267 0 0 1.896 60.2909907813383 104.159191340019)" fill="#fedabb" fill-rule="evenodd" stroke="#fedabb" stroke-width="0.24" stroke-linecap="square" stroke-linejoin="bevel" d="M36 60.05C30.1663 54.1892 18.5205 47.9128 0 48.05L0 0.0500078C11.9286 -0.0196873 24.5841 -0.161561 36 12.05C48.4758 0.479307 60.0916 -0.252861 72 0.0500078L72 48.05C55.2722 48.1125 43.2722 52.1125 36 60.05Z"/>
          </svg>
        </span>
        <span>
          <span class="brand-name">Gensheet</span>
          <span class="brand-sub">Wiki de Teyvat</span>
        </span>
      </div>

      <!-- Navigation et pages générées depuis SCREENS dans main.js. -->
      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <main class="main">
      <div class="main-inner" id="pages"></div>
    </main>
  </div>

  <!-- Réaffichée à chaque lancement tant que la mise à jour n'est pas faite. -->
  <div id="update-banner" class="update-banner" hidden>
    <div class="update-text">
      <strong>Mise à jour disponible</strong>
      <span class="muted" id="update-version"></span>
    </div>
    <button id="update-btn">Mettre à jour</button>
    <button id="update-close" class="ghost" title="Plus tard">×</button>
  </div>
</body>
</html>
